Plasma wordt de "vierde staat" van materie genoemd omdat het een aparte fase is, naast vast, vloeibaar en gas. In plasma zijn atomen geïoniseerd: ze zijn opgesplitst in geladen deeltjes (ionen en elektronen) door hoge energie, zoals extreme hitte of elektrische velden. Dit geeft plasma unieke eigenschappen — zoals het geleiden van elektriciteit en het reageren op magnetische velden — die het onderscheiden van de andere drie toestanden.
De volgorde van de staten komt voort uit de toenemende energie van de deeltjes:
1. Vast: deeltjes zijn sterk gebonden, met weinig beweging.
2. Vloeibaar: deeltjes hebben meer vrijheid en kunnen stromen.
3. Gas: deeltjes bewegen vrij en chaotisch.
4. Plasma: deeltjes zijn zo energiek dat elektronen losraken, waardoor een geïoniseerd, reactief mengsel ontstaat.
Plasma komt voor in sterren, bliksem en neonlampen, en is eigenlijk de meest voorkomende toestand van materie in het universum, hoewel minder gebruikelijk op aarde.

"In plasma zijn atomen geïoniseerd, wat betekent dat ze zijn opgesplitst in geladen deeltjes (ionen en elektronen)" → kun je dit nader uitleggen / hierover uitweiden?

### Wat is ionisatie?
Ionisatie is het proces waarbij een atoom (of molecuul) een of meer elektronen verliest of opneemt, waardoor het een netto elektrische lading krijgt. Een neutraal atoom heeft evenveel protonen (positief geladen) als elektronen (negatief geladen), waardoor de lading in balans is. Wanneer een atoom voldoende energie krijgt — bijvoorbeeld door hitte, straling of een elektrisch veld — kan een elektron worden losgeslagen uit zijn baan rond de kern. Dit resulteert in:
• Een positief geladen ion: het atoom dat een elektron verliest, heeft nu meer protonen dan elektronen.
• Een vrij elektron: het losgeslagen elektron is een negatief geladen deeltje dat vrij kan bewegen.
In plasma is een groot deel van de materie in deze geïoniseerde toestand: het bestaat uit een mengsel van positieve ionen, vrije elektronen en soms nog neutrale atomen of moleculen.
### Hoe ontstaat plasma?
Plasma ontstaat wanneer materie voldoende energie krijgt om de elektronen van atomen los te maken. Dat kan op verschillende manieren:
1. Hoge temperatuur: bij extreme hitte (zoals in sterren of bij een blikseminslag) krijgen atomen zoveel kinetische energie dat botsingen tussen deeltjes elektronen losrukken. In de zon wordt waterstofplasma gevormd bij temperaturen van miljoenen graden Celsius.
2. Elektrische velden: in een neonlamp of een plasma-tv wordt een sterk elektrisch veld toegepast dat elektronen uit atomen losmaakt.
3. Straling: ultraviolette straling, röntgenstraling of andere vormen van hoogenergetische straling kunnen atomen ioniseren.
4. Chemische of nucleaire processen: soms leveren chemische reacties of nucleaire processen voldoende energie om plasma te vormen.
### Eigenschappen van plasma
Omdat plasma bestaat uit geladen deeltjes (ionen en elektronen), heeft het unieke eigenschappen die het onderscheiden van vaste stoffen, vloeistoffen en gassen:
• Elektrische geleiding: vrije elektronen maken plasma een uitstekende geleider van elektriciteit. Daarom geleidt bliksem (een vorm van plasma) elektriciteit.
• Gevoeligheid voor magnetische en elektrische velden: de geladen deeltjes reageren sterk op elektromagnetische krachten, wat leidt tot complexe bewegingen en patronen, zoals in de zon of in een plasma-bal.
• Lichtemissie: wanneer elektronen terugvallen naar een lagere energietoestand, geven ze licht af. Dit verklaart de gloed van neonlampen, het noorderlicht en het licht van sterren.
• Hoge energie: plasma vereist en bevat veel energie, waardoor het vooral voorkomt in extreme omgevingen zoals sterren, kernfusiereactoren of bij bliksem.
### Waarom de "vierde staat"?
De benaming komt voort uit de volgorde van energietoestanden van materie. Verwarm je materie, dan doorloopt het de fasen vast → vloeibaar → gas → plasma: bij steeds hogere energie worden uiteindelijk elektronen losgerukt en wordt de materie een dynamisch mengsel van geladen deeltjes. Hoewel plasma soms op een gas lijkt (het heeft geen vaste vorm of volume), is het fundamenteel anders door de aanwezigheid van geladen deeltjes en hun interacties.
### Voorbeelden van plasma
• In de natuur: de zon en andere sterren zijn grotendeels plasma, net als de zonnewind en de ionosfeer van de aarde. Bliksem en het noorderlicht (aurora) zijn aardse voorbeelden.
• In technologie: plasma wordt gebruikt in tl-buizen, neonreclames, plasma-tv's en kernfusiereactoren (zoals ITER), maar ook bij plasmasnijden en het maken van microchips.
• In het universum: ongeveer 99% van de zichtbare materie (sterren, nevels) is plasma — daarmee is het eigenlijk de meest voorkomende toestand van materie.
### Interessante details
• Gedrag van plasma: plasma is vaak turbulent en complex door de interacties tussen geladen deeltjes — een belangrijk onderzoeksgebied, vooral voor fusie-energie en astrofysica.
• Deeltjesdynamiek: vrije elektronen bewegen veel sneller dan de zwaardere ionen, wat leidt tot effecten zoals plasmagolven en instabiliteiten.
• Koud plasma: hoewel plasma vaak met hoge temperaturen wordt geassocieerd, kun je "koud plasma" (rond kamertemperatuur) maken met lage druk en elektrische velden, zoals in sommige medische toepassingen (bijv. wonddesinfectie).
Kortom: ionisatie maakt plasma uniek doordat het materie verandert in een dynamisch, geladen systeem met eigenschappen die we niet zien in vaste stoffen, vloeistoffen of gassen. Laat het me weten als je meer wilt weten over een specifiek aspect.

Geweldige vragen! Laten we ze een voor een behandelen.
1. Bliksem: is het elektriciteit of plasma? Welke materie is geïoniseerd?
Je hebt gelijk dat bliksem sterk geassocieerd wordt met elektriciteit, maar het is iets complexer. Bliksem is een snelle ontlading van elektrische energie tussen twee punten (bijvoorbeeld tussen een wolk en de grond). Die ontlading vindt plaats in een kanaal van plasma, dat ontstaat doordat de lucht door de enorme elektrische spanning wordt geïoniseerd. De elektriciteit (stroom van geladen deeltjes, vooral elektronen) beweegt door dit plasma-kanaal. Bliksem is dus zowel een elektrische ontlading als een vorm van plasma.
Welke materie wordt geïoniseerd? Het is inderdaad de lucht. Lucht bestaat voornamelijk uit stikstof (N₂, ~78%) en zuurstof (O₂, ~21%), met sporen van andere gassen. Tijdens een ontlading wordt de lucht in het kanaal extreem snel verhit (tot wel 30.000 °C). Deze energie breekt de moleculen op in atomen en ioniseert ze door elektronen los te slaan. Het resultaat is een plasma van positieve ionen (bijv. N⁺, O⁺), vrije elektronen en enkele niet volledig geïoniseerde neutrale deeltjes.
2. Wat is een plasma-bal?
Een plasma-bal (plasmaglobe of plasma-lamp) is een glazen bol gevuld met een mengsel van edelgassen (neon, argon of krypton) onder lage druk. In het midden zit een elektrode die verbonden is met een hoogspanningsbron. Wordt de spanning aangezet, dan ioniseren de gassen en ontstaat plasma, dat zich manifesteert als kleurrijke, bewegende lichtfilamenten — kleine bliksemschichtjes. Leg je je hand op het glas, dan beïnvloed je het elektrische veld en "volgen" de filamenten je vinger. Het is een mooi voorbeeld van koud plasma: de temperatuur blijft relatief laag, maar de gassen zijn nog steeds geïoniseerd.
3. Elektronen die terugvallen naar een lagere energietoestand
Dit is een proces uit de kwantumfysica dat lichtproductie verklaart.
• Energietoestanden: in een atoom of ion zitten elektronen in specifieke energieniveaus rond de kern. Een elektron in een hoger niveau (aangeslagen toestand) heeft meer energie dan een elektron in een lager niveau (grondtoestand).
• Aanslag: in plasma krijgen elektronen energie door botsingen of elektrische velden, wat ze naar een hoger niveau "optilt".
• Terugvallen: een aangeslagen elektron is onstabiel en valt na korte tijd (vaak nanoseconden) terug naar een lager niveau. Daarbij geeft het de overtollige energie af als een foton (lichtdeeltje). De golflengte — en dus de kleur — hangt af van het energieverschil tussen de twee niveaus.
• Waarom dit in plasma opvalt: er zijn veel deeltjes die constant worden aangeslagen en terugvallen, wat de karakteristieke gloed geeft. In een neonlamp bijvoorbeeld geeft aangeslagen neon rood-oranje licht af, specifiek voor de energieniveaus van neon.
4. Is plasma nog steeds dezelfde materie?
Een scherpe vraag, die raakt aan wat materie eigenlijk definieert.
• Chemische identiteit: de samenstelling blijft in principe hetzelfde. Verwarm je ijzer tot plasma, dan bestaat het nog steeds uit ijzeratomen (of -ionen); alleen zijn er elektronen losgeslagen. De atoomkernen — die de identiteit van het element bepalen — blijven ongewijzigd. IJzerplasma is dus nog steeds "ijzer".
• Fysische toestand: wat verandert, is de toestand. In vloeibaar ijzer zijn de atomen nog neutraal; in plasma zijn veel ervan geïoniseerd en gedraagt de materie zich als een dynamisch mengsel van geladen deeltjes.
• Vergelijking: net zoals vloeibaar en gasvormig ijzer nog steeds ijzer zijn, is ijzerplasma ook ijzer — maar met drastisch andere eigenschappen door de ionisatie.
5. Heeft een gas een vast volume?
• Definitie: in tegenstelling tot vaste stoffen en vloeistoffen past een gas zich aan de container aan. Stop je gas in een ballon, dan neemt het de vorm en het volume van de ballon aan. Het volume wordt dus bepaald door de container, niet door het gas zelf.
• Invloed van druk en temperatuur: je hebt gelijk dat bij een specifieke massa, temperatuur en druk een gas een bepaald volume inneemt, volgens de ideale gaswet PV = nRT (P = druk, V = volume, n = aantal mol, R = gasconstante, T = temperatuur). Verandert de druk of temperatuur, of wordt de container groter, dan verandert het volume.
• Vergelijking: een vloeistof heeft een vast volume (maar geen vaste vorm), een vaste stof heeft beide. Een gas heeft geen van beide, tenzij het door een container wordt beperkt.
6. Ionosfeer: welke materie is plasma?
De ionosfeer is een laag in de bovenste atmosfeer (ongeveer 50–1000 km hoog) waar een deel van de gassen geïoniseerd is door zonnestraling (ultraviolet en röntgen). Het bestaat uit dezelfde gassen als de rest van de atmosfeer — stikstof (N₂), zuurstof (O₂) en sporen van andere gassen — die door de straling deels worden geïoniseerd tot ionen zoals N⁺, O⁺ en O₂⁺ plus vrije elektronen. Het is dus een dun, gedeeltelijk plasma. De ionosfeer speelt een cruciale rol in radiocommunicatie (de vrije elektronen weerkaatsen radiogolven) en is de plek waar het noorderlicht ontstaat.
### Samenvatting
• Bliksem: een elektrische ontlading door een plasma-kanaal van geïoniseerde lucht (vooral stikstof en zuurstof).
• Plasma-bal: een glazen bol met geïoniseerde edelgassen die lichtfilamenten produceert.
• Elektronen terugvallen: aangeslagen elektronen geven licht af wanneer ze terugvallen naar een lager niveau.
• Zelfde materie? Plasma behoudt de chemische identiteit (ijzer blijft ijzer), maar de fysische eigenschappen veranderen.
• Gasvolume: een gas heeft geen vast volume of vorm, maar past zich aan de container aan.
• Ionosfeer: geïoniseerde luchtmoleculen door zonnestraling, dus een gedeeltelijk plasma.

"Die ontlading vindt plaats in een kanaal van plasma" → dus er wordt eerst een 'plasma-kanaal' gevormd tussen de wolk en de grond? Is dat kanaal dan enkele honderden meters lang? En hoe dik is zo'n plasma-kanaal?

[GROK]
Ja, je hebt het goed begrepen: bij bliksem wordt inderdaad eerst een plasma-kanaal gevormd tussen de wolk en de grond (of tussen twee punten, zoals binnen een wolk).
1. Vorming van het plasma-kanaal
Bliksem ontstaat door een sterke elektrische spanning tussen twee punten. Voordat de zichtbare flits plaatsvindt, wordt een plasma-kanaal gevormd in een proces dat de leiderontlading (of "leader") heet:
1. Een stroomvoerende leider (meestal een negatief geladen "stepped leader") vertrekt vanuit de wolk richting de grond — een zwakke, voorlopige ontlading die een pad door de lucht zoekt.
2. De lucht in dat pad wordt door de hoge spanning geïoniseerd, waardoor een geleidend plasma-kanaal van ionen en vrije elektronen ontstaat.
3. Komt de leider dicht bij de grond, dan kan een positief geladen tegenleider vanaf de grond omhoog bewegen. Ontmoeten die twee elkaar, dan is het kanaal compleet en stroomt de krachtige ontlading (de zichtbare flits) erdoorheen.
Dit gebeurt in microseconden tot milliseconden; de uiteindelijke "return stroke" haalt bijna de snelheid van het licht.
2. Lengte van het plasma-kanaal
Het kanaal kan enkele honderden meters tot meerdere kilometers lang zijn. Typische bliksem tussen wolk en grond overbrugt 2 tot 5 kilometer, maar bij horizontale (wolk-tot-wolk) bliksem kan het langer zijn.
3. Hoe dik is het plasma-kanaal?
Verrassend dun: het eigenlijke kanaal heeft een diameter van slechts enkele centimeters tot ongeveer 10 cm tijdens de piek — meestal rond de 2–5 cm. Dat bliksem veel breder lijkt, komt door:
• Lichtverstrooiing: het intense licht wordt verstrooid door waterdruppels of stof.
• Thermische uitzetting: het kanaal wordt extreem heet (tot 30.000 °C), waardoor de omringende lucht snel uitzet (en de donder veroorzaakt).
• Meervoudige ontladingen: een flits bestaat vaak uit meerdere snelle ontladingen door hetzelfde kanaal.
Het kanaal is niet perfect recht; het zigzagt door variaties in luchtdichtheid, vochtigheid en elektrische velden — vandaar de typische kronkelige vorm.

Je vragen duiken diep in de details! Laten we ze systematisch beantwoorden.
1. Bliksem: zien we elektriciteit of elektronen die terugvallen?
Het is niet direct "de elektriciteit" die we zien, maar het licht dat in het plasma-kanaal wordt uitgezonden.
• Wat is elektriciteit in bliksem? De beweging van geladen deeltjes (vooral elektronen) door het kanaal. Die beweging zelf is niet zichtbaar.
• Waarom zien we licht? Door twee processen. Ten eerste: elektronen die terugvallen naar een lagere energietoestand. Atomen en moleculen (vooral stikstof en zuurstof) worden aangeslagen door de intense energie; vallen de elektronen terug, dan komen er fotonen vrij. Bij bliksem is dat licht vaak wit-blauw door de ionisatie van stikstof en zuurstof. Ten tweede: thermische straling, omdat het kanaal extreem heet wordt (tot 30.000 °C) en dan gloeit als een wit-heet object.
• Samengevat: je ziet niet de elektriciteit zelf, maar het licht dat ontstaat door aangeslagen elektronen die terugvallen en door de intense hitte. De elektriciteit is de onderliggende oorzaak; het licht is het zichtbare resultaat.
2. Hoe ziet een kilogram ijzer in plasma-toestand eruit?
• Wat gebeurt er? Verhit je een kg ijzer (Fe) tot duizenden tot tienduizenden graden, dan worden de atomen geïoniseerd: een mengsel van ijzerionen (Fe⁺, Fe²⁺, …), vrije elektronen en mogelijk nog enkele neutrale atomen.
• Gloed en licht: het zou helder gloeien, waarschijnlijk wit-blauw of wit-geel, afhankelijk van temperatuur en ionisatiegraad. De gloed komt van elektronen die terugvallen naar lagere niveaus, net als bij bliksem of in een plasma-bal.
• Vorm en volume: plasma heeft, net als gas, geen vaste vorm of volume. Een kg ijzerplasma zou zich uitspreiden in de beschikbare ruimte, tenzij het wordt ingesloten door een magnetisch veld (zoals in een fusiereactor).
• Dynamisch gedrag: het zou er "levendig" uitzien, met wervelende of golvende patronen door de interacties tussen geladen deeltjes en eventuele velden.
Stel je dus een wolk van gloeiend, wit-blauw licht voor, die pulseert en beweegt als een vloeistof of gas, maar met een "elektrische" uitstraling, zoals de filamenten in een plasma-bal — vormloos, voortdurend in beweging, extreem helder en heet.
3. Gasvolume: 1 kg O₂ vs. 2 kg O₂ in een ballon
• De ideale gaswet PV = nRT bepaalt het volume.
• Je voorbeeld: 1 kg O₂ is ongeveer 31,25 mol (molaire massa O₂ ≈ 32 g/mol); 2 kg is 62,5 mol.
• Zelfde ballon, zelfde druk en temperatuur: dan kan de ballon niet zomaar meer gas bevatten zonder dat de druk stijgt. Om 2 kg te bevatten moet de ballon uitzetten óf de druk toenemen.
• Conclusie: in een vaste container veroorzaakt 2 kg O₂ een hogere druk dan 1 kg bij hetzelfde volume; in een elastische ballon neemt het volume toe. Dat laat zien dat het volume van een gas niet inherent vast is, maar afhangt van de hoeveelheid gas en de omstandigheden.
4. Ionosfeer en radiocommunicatie: reflectie van radiogolven
Ja, precies! De vrije elektronen in de ionosfeer reflecteren radiogolven terug naar de aarde in plaats van ze verloren te laten gaan in de ruimte. Radiogolven botsen met de vrije elektronen, die onder invloed van het elektrische veld oscilleren en de golf kunnen reflecteren — afhankelijk van de frequentie en de elektronendichtheid. Vooral lage frequenties (AM, kortegolf) worden effectief gereflecteerd en kunnen zo over grote afstanden reizen door te "stuiteren" tussen ionosfeer en aardoppervlak. Hogere frequenties (FM, microgolven) gaan er vaak doorheen — handig voor satellietcommunicatie, minder voor langeafstandsreflectie.

Je vragen gaan recht naar de kern. Laten we de verwarring over "vast volume" en de definitie van volume ophelderen.
1. Bevestigt de uitzetting van de ballon niet dat gas een volume heeft?
Je hebt gelijk dat een gas een volume inneemt. In je voorbeeld met 1 of 2 kg O₂ bij een bepaalde druk en temperatuur heeft het gas inderdaad een meetbaar volume, beschreven door PV = nRT. Bij een vaste druk en temperatuur bepaalt de hoeveelheid gas (n) het volume (V). In die zin heeft een gas een volume onder specifieke omstandigheden.
Toen ik zei "geen inherent vast volume", bedoelde ik: anders dan een vaste stof of vloeistof heeft een gas geen volume dat onafhankelijk is van zijn omgeving. Een blok ijzer houdt zijn volume, 1 liter water blijft 1 liter — maar een gas past zijn volume aan aan de container, de druk en de temperatuur. Je ballonvoorbeeld bevestigt dat het volume meetbaar is, maar niet "vast" in de zin van een inherente eigenschap: het verandert met de hoeveelheid gas en de omstandigheden.
2. Wat is de definitie van volume?
Volume is de hoeveelheid ruimte die een stof inneemt, gemeten in bijvoorbeeld kubieke meters of liters.
• Voor een vaste stof: vast, bepaald door de fysieke afmetingen.
• Voor een vloeistof: ook vast — 1 liter water blijft 1 liter, ongeacht de vorm van de container.
• Voor een gas: niet vast, want het gas spreidt zich uit om de hele container te vullen; het volume hangt af van container, druk en temperatuur.
Een gas heeft geen "vast volume" omdat het geen inherente grenzen heeft. Haal je het uit een container (bijv. in een vacuüm), dan spreidt het zich onbeperkt uit. Ter illustratie: een blok van 1 kg ijzer heeft een vast volume van ongeveer 127 cm³, 1 liter water blijft 1 liter, maar 1 kg O₂ in een ballon heeft een volume dat afhangt van druk, temperatuur en de grootte van de ballon.

Fascinerende vraag — die dwingt ons om vanuit een kosmisch perspectief naar het gedrag van gassen te kijken.
1. Wat betekent "vergassen" van 1 kg ijzer?
IJzer smelt bij ongeveer 1538 °C en kookt bij ongeveer 2862 °C (bij standaarddruk op aarde). In gasfase worden de ijzeratomen losgemaakt uit hun kristalstructuur en bewegen ze vrij. Anders dan water (dat in gasvorm moleculen vormt) bestaat ijzergas meestal uit losse ijzeratomen.
2. De cosmos als omgeving
Laten we aannemen dat het ijzergas vrijkomt in de interstellaire of intergalactische ruimte:
• Lage dichtheid en druk: de interstellaire ruimte heeft een extreem lage dichtheid (ongeveer 1 atoom per cm³) en vrijwel geen druk (bijna een perfect vacuüm).
• Temperatuur: die varieert sterk, van enkele kelvin in koude wolken tot miljoenen kelvin nabij sterren.
• Geen container: er is niets om het gas te beperken — wat grote gevolgen heeft.
3. Wat gebeurt er met de ijzeratomen?
• Uitzetting: zonder container verspreiden de atomen zich door hun kinetische energie in alle richtingen. Bij ongeveer 3135 K (de kooktemperatuur) hebben ze een gemiddelde snelheid van zo'n 500–1000 m/s.
• Diffusie in het vacuüm: de dichtheid is zo laag dat de atomen nauwelijks botsen; ze blijven zich vrijwel onbeperkt uitspreiden, zodat het volume theoretisch naar oneindig gaat.
• Koeling en condensatie: in koude delen verliezen de atomen energie via straling, koelen af en kunnen condenseren tot kleine vaste deeltjes (stof).
• Mogelijke ionisatie: bij intense straling of extreme hitte kunnen ze verder ioniseren tot plasma (Fe⁺, Fe²⁺ en vrije elektronen).
4. Hoe verhoudt dit zich tot volume?
• In een ballon op aarde heeft 1 kg ijzergas een meetbaar volume, bepaald door de container en de omstandigheden.

How is plasma the 'fourth state' of matter?

[GROK]
Plasma is called the "fourth state" of matter because it's a separate phase, alongside solid, liquid and gas. In plasma, atoms are ionised: they're split into charged particles (ions and electrons) by high energy, such as extreme heat or electric fields. This gives plasma unique properties — like conducting electricity and responding to magnetic fields — that distinguish it from the other three states.
The order of the states comes from the increasing energy of the particles:
1. Solid: particles are strongly bound, with little movement.
2. Liquid: particles have more freedom and can flow.
3. Gas: particles move freely and chaotically.
4. Plasma: particles are so energetic that electrons break free, creating an ionised, reactive mixture.
Plasma occurs in stars, lightning and neon lamps, and is actually the most common state of matter in the universe, though less common on Earth.

[HAJO]
"In plasma, atoms are ionised, which means they're split into charged particles (ions and electrons)" → can you explain this further / elaborate on it?

[GROK]
Sure! Let's go deeper into what it means that atoms in plasma are ionised and how that process works.
### What is ionisation?
Ionisation is the process by which an atom (or molecule) loses or gains one or more electrons, giving it a net electric charge. A neutral atom has as many protons (positively charged) as electrons (negatively charged), so the charge is balanced. When an atom gets enough energy — for example through heat, radiation or an electric field — an electron can be knocked out of its orbit around the nucleus. This results in:
• A positively charged ion: the atom that loses an electron now has more protons than electrons.
• A free electron: the knocked-out electron is a negatively charged particle that can move freely.
In plasma, a large part of the matter is in this ionised state: it consists of a mixture of positive ions, free electrons and sometimes still-neutral atoms or molecules.
### How does plasma form?
Plasma forms when matter gets enough energy to free the electrons from atoms. That can happen in various ways:
1. High temperature: at extreme heat (as in stars or a lightning strike) atoms get so much kinetic energy that collisions between particles tear electrons loose. In the sun, hydrogen plasma is formed at temperatures of millions of degrees Celsius.
2. Electric fields: in a neon lamp or a plasma TV a strong electric field is applied that frees electrons from atoms.
3. Radiation: ultraviolet radiation, X-rays or other forms of high-energy radiation can ionise atoms.
4. Chemical or nuclear processes: sometimes chemical reactions or nuclear processes supply enough energy to form plasma.
### Properties of plasma
Because plasma consists of charged particles (ions and electrons), it has unique properties that distinguish it from solids, liquids and gases:
• Electrical conduction: free electrons make plasma an excellent conductor of electricity. That's why lightning (a form of plasma) conducts electricity.
• Sensitivity to magnetic and electric fields: the charged particles respond strongly to electromagnetic forces, leading to complex movements and patterns, as in the sun or in a plasma ball.
• Light emission: when electrons fall back to a lower energy state, they give off light. This explains the glow of neon lamps, the northern lights and the light of stars.
• High energy: plasma requires and contains a lot of energy, which is why it mainly occurs in extreme environments such as stars, nuclear fusion reactors or in lightning.
### Why the "fourth state"?
The name comes from the order of the energy states of matter. Heat matter up, and it passes through the phases solid → liquid → gas → plasma: at ever higher energy, electrons are eventually torn loose and the matter becomes a dynamic mixture of charged particles. Although plasma sometimes resembles a gas (it has no fixed shape or volume), it is fundamentally different because of the presence of charged particles and their interactions.
### Examples of plasma
• In nature: the sun and other stars are largely plasma, as are the solar wind and the Earth's ionosphere. Lightning and the northern lights (aurora) are earthly examples.
• In technology: plasma is used in fluorescent tubes, neon signs, plasma TVs and nuclear fusion reactors (such as ITER), but also in plasma cutting and the making of microchips.
• In the universe: about 99% of visible matter (stars, nebulae) is plasma — making it actually the most common state of matter.
### Interesting details
• Behaviour of plasma: plasma is often turbulent and complex because of the interactions between charged particles — an important area of research, especially for fusion energy and astrophysics.
• Particle dynamics: free electrons move much faster than the heavier ions, leading to effects such as plasma waves and instabilities.
• Cold plasma: although plasma is often associated with high temperatures, you can make "cold plasma" (around room temperature) with low pressure and electric fields, as in some medical applications (e.g. wound disinfection).

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel">
// chat-view.jsx — components for rendering an AI Fluisteraar chat

const { useState, useEffect, useRef, useMemo } = React;

// --- i18n ------------------------------------------------------------
// Shared NL/EN switch, synced with the landing page via localStorage 'aifl-lang'.
const LangContext = React.createContext('nl');
const STR = {
  nl: {

    kickerPre: 'A conversation with ', minRead: 'min read', turns: 'turns',
    loading: 'Loading…',

    zwEndAria: 'End of the bonus', zwEndLabel: 'End of bonus',
  },
};
function useStr() { return STR[React.useContext(LangContext)]; }

// --- Helpers ---------------------------------------------------------

// Estimate reading time at ~200 words/min
function estimateReadingTime(turns) {
  const words = turns.reduce((a, t) => a + (t.text ? t.text.split(/\s+/).length : 0), 0);
  return Math.max(1, Math.round(words / 200));
}

// Smooth-scroll to an anchored element, accounting for the sticky topbar
function jumpToAnchor(id) {
  const el = document.getElementById(id);
  if (el) {
    const y = el.getBoundingClientRect().top + window.scrollY - 72;
    window.scrollTo({ top: y, behavior: 'smooth' });
  }
}

// Short label for ToC item — first ~7 words of the user prompt
function tocSnippet(text) {
  const cleaned = text.replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
  const words = cleaned.split(' ');
  const snippet = words.slice(0, 9).join(' ');
  return snippet + (words.length > 9 ? '…' : '');
}

// Convert turn raw text → structured blocks
// Recognizes paragraphs, bullets (•), numbered lists (1.), small headers (lines with emoji + bold-looking title)
function parseBlocks(raw) {
  const lines = raw.split('\n').map(l => l.trimEnd());
  const blocks = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.trim() === '') { i++; continue; }

    // Explicit sub-heading: "### Title"
    if (/^###\s+/.test(l)) {
      blocks.push({ type: 'h3', text: l.replace(/^###\s+/, '') });
      i++;
      continue;
    }

    // Header pattern: starts with emoji + short title-like line
    if (/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}✅❗📌📎🎯]/u.test(l) && l.length < 90 && !/^[•·]/.test(l)) {
      // Try to detect if this is a "heading" — usually one line, often followed by bullets
      const next = lines[i + 1] || '';
      if (l.length < 90) {
        blocks.push({ type: 'h3', text: l.replace(/^([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}✅❗📌📎🎯])\s*/u, '$1  ') });
        i++;
        continue;
      }
    }

    // Bullet list
    if (/^[•·]\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^[•·]\s/.test(lines[i])) {
        items.push(lines[i].replace(/^[•·]\s+/, ''));
        i++;
      }
      blocks.push({ type: 'ul', items });
      continue;
    }

    // Numbered list
    if (/^\d+\.\s/.test(l)) {
      const items = [];
      const numbers = [];
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) {
        const m = lines[i].match(/^(\d+)\.\s+(.*)$/);
        numbers.push(parseInt(m[1]));
        items.push(m[2]);
        i++;
      }
      // If only a single item, it's likely a numbered header (e.g. "1. Cognitieve intelligentie (IQ)")
      // followed by bullets — render as a paragraph with the number preserved.
      if (items.length === 1) {
        blocks.push({ type: 'numHead', num: numbers[0], text: items[0] });
      } else {
        blocks.push({ type: 'ol', items, start: numbers[0] });
      }
      continue;
    }

    // Paragraph (single line in our reflowed text)
    blocks.push({ type: 'p', text: l });
    i++;
  }
  return blocks;
}

// Render inline formatting: _italic_, ==review-mark== (reconstructed/uncertain)
function renderInline(text) {
  // Split on ==highlight== first, then _italic_ within plain segments
  const parts = text.split(/(==[^=\n]+==)/g);
  return parts.map((p, idx) => {
    if (/^==[^=]+==$/.test(p)) {
      return <mark key={idx} className="recon" title={(typeof document !== 'undefined' && document.documentElement.lang === 'en') ? STR.en.reconTitle : STR.nl.reconTitle}>{p.slice(2, -2)}</mark>;
    }
    const sub = p.split(/(_[^_\n]+_)/g);
    return sub.map((q, j) => /^_[^_]+_$/.test(q) ? <em key={idx + '-' + j}>{q.slice(1, -1)}</em> : q);
  });
}

// --- ProgressBar ----------------------------------------------------
function ProgressBar() {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setPct(max > 0 ? Math.min(100, (h.scrollTop / max) * 100) : 0);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
    };
  }, []);
  return <div className="progress-bar" style={{ width: pct + '%' }} />;
}

// --- TopBar ---------------------------------------------------------
function TopBar({ backUrl, lang, onLang }) {
  const S = STR[lang];
  const onPrint = () => window.print();
  const onShare = async () => {
    const data = { title: document.title, url: location.href };
    if (navigator.share) {
      try { await navigator.share(data); } catch (_) {}
    } else if (navigator.clipboard) {
      try {
        await navigator.clipboard.writeText(location.href);
        // Tiny ephemeral feedback
        const btn = document.querySelector('[data-share-btn]');
        if (btn) {
          const orig = btn.innerHTML;
          btn.innerHTML = S.copied;
          setTimeout(() => { btn.innerHTML = orig; }, 1400);
        }
      } catch (_) {}
    }
  };
  return (
    <header className="topbar">
      <div className="topbar-inner">
        <a className="back-link" href={backUrl || 'https://www.hajotheunissen.nl/ai-fluisteraar'}>
          <span className="arrow">←</span>
          <span>{S.brand}</span>
        </a>
        <div className="topbar-actions">
          <span className="lang-toggle" role="group" aria-label="Taal / Language">
            <button type="button" className={lang === 'nl' ? 'on' : ''} onClick={() => onLang('nl')}>NL</button>
            <button type="button" className={lang === 'en' ? 'on' : ''} onClick={() => onLang('en')}>EN</button>
          </span>
          <button className="icon-btn" data-share-btn onClick={onShare} title={S.shareTitle}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>
            </svg>
            <span>{S.share}</span>
          </button>
          <button className="icon-btn" onClick={onPrint} title={S.printTitle}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"/>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
              <rect x="6" y="14" width="12" height="8"/>
            </svg>
            <span>{S.print}</span>
          </button>
        </div>
      </div>
    </header>
  );
}

// --- Sidebar ToC ---------------------------------------------------
function Sidebar({ turns, activeId }) {
  const S = useStr();
  const userTurns = turns.map((t, i) => ({ ...t, idx: i })).filter(t => t.speaker === 'user');
  return (
    <aside className="sidebar">
      <p className="toc-heading">{S.questions(userTurns.length)}</p>
      <ul className="toc-list">
        {userTurns.map(t => (
          <li key={t.idx}>
            <a
              href={`#turn-${t.idx}`}
              className={'toc-item' + (activeId === t.idx ? ' active' : '')}
              onClick={(e) => {
                e.preventDefault();
                const el = document.getElementById(`turn-${t.idx}`);
                if (el) {
                  const y = el.getBoundingClientRect().top + window.scrollY - 72;
                  window.scrollTo({ top: y, behavior: 'smooth' });
                }
              }}
            >
              {tocSnippet(t.text)}
            </a>
          </li>
        ))}
      </ul>
    </aside>
  );
}

// --- Turn ----------------------------------------------------------
function Turn({ turn, idx, participantUser, participantAI, aside }) {
  const blocks = useMemo(() => parseBlocks(turn.text), [turn.text]);
  const label = turn.speaker === 'user'
    ? (turn.name || participantUser)
    : (turn.name || participantAI);
  return (
    <section
      id={`turn-${idx}`}
      className={'turn ' + (turn.speaker === 'user' ? 'turn-user' : 'turn-ai') + (aside ? ' turn-aside' : '')}
    >
      <p className="turn-label">
        <span>{label}</span>
      </p>
      <div className="turn-body">
        {blocks.map((b, i) => {
          if (b.type === 'p') return <p key={i}>{renderInline(b.text)}</p>;
          if (b.type === 'h3') return <h3 key={i}>{renderInline(b.text)}</h3>;
          if (b.type === 'numHead') return (
            <h3 key={i} className="num-head"><span className="num">{b.num}.</span> {renderInline(b.text)}</h3>
          );
          if (b.type === 'ul') return (
            <ul key={i}>{b.items.map((it, j) => <li key={j}>{renderInline(it)}</li>)}</ul>
          );
          if (b.type === 'ol') return (
            <ol key={i} start={b.start}>{b.items.map((it, j) => <li key={j}>{renderInline(it)}</li>)}</ol>
          );
          return null;
        })}
      </div>
    </section>
  );
}

// --- Reading warning (standard format element) ---------------------
const DEFAULT_WARNING = "Eerlijk is eerlijk: dit is geen lichte kost. Wat volgt is een lang traktaat — metafysica, eindeloze nuance en detail tot ver achter de komma. Een echte diepe duik. Lees het op een dag dat je hoofd er de ruimte voor heeft, of bewaar het voor later. Snelle scrollers en ongeduldige geesten haken hier waarschijnlijk af. Helemaal goed. De rest: schenk thee in en neem de tijd.";

function ReadingWarning({ text }) {
  const S = useStr();
  if (!text) return null;
  return (
    <aside className="reading-warning" role="note">
      <p className="rw-label">{S.warningLabel}</p>
      <p className="rw-text">{text}</p>
    </aside>
  );
}

// --- Side-track start / end markers --------------------------------
function SectionMarker({ marker }) {
  const S = useStr();
  if (marker === 'zijweg-start') {
    return (
      <div id="zijweg-start" className="zijweg zijweg-start" role="note">
        <p className="zw-label">{S.zwStartLabel}</p>
        <h2 className="zw-title">{S.zwStartTitle}</h2>
        <p className="zw-text" dangerouslySetInnerHTML={{ __html: S.zwStartText }} />
      </div>
    );
  }
  return (
    <div id="zijweg-end" className="zijweg zijweg-end" role="separator" aria-label={S.zwEndAria}>
      <span className="zw-rule" />
      <span className="zw-end-label">{S.zwEndLabel}</span>
      <span className="zw-rule" />
    </div>
  );
}

// --- Conversation start marker -------------------------------------
function ConversationStart({ date }) {
  const S = useStr();
  return (
    <div className="convo-start" role="separator" aria-label={S.convoStartAria}>
      <span className="cs-rule" />
      <span className="cs-label">{S.conversationStart}{date ? ` · ${date}` : ''}</span>
      <span className="cs-rule" />
    </div>
  );
}

// --- Header (title block) -----------------------------------------
function TitleBlock({ meta, readingMinutes }) {
  const S = useStr();
  return (
    <header className="title-block">
      <p className="kicker">
        {S.kickerPre}<strong style={{ fontWeight: 600, color: 'var(--ink)' }}>{meta.model}</strong>
        <span className="dot"/> H.J. Theunissen
      </p>
      <h1 className="title">{meta.title}</h1>
      <div className="meta-row">
        <span>{meta.date}</span>
        <span className="sep">·</span>
        <span>{readingMinutes} {S.minRead}</span>
        <span className="sep">·</span>
        <span>{meta.turnCount} {S.turns}</span>
      </div>
      <p className="synopsis">{meta.synopsis}</p>
      <div className="title-rule"/>
    </header>
  );
}

// --- Active turn observer -----------------------------------------
function useActiveTurn(turns) {
  const [active, setActive] = useState(null);
  useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        const visible = entries
          .filter(e => e.isIntersecting)
          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (visible.length) {
          const idStr = visible[0].target.id;
          const m = idStr.match(/^turn-(\d+)$/);
          if (m) {
            // Find nearest preceding user turn
            let i = parseInt(m[1]);
            while (i >= 0 && turns[i].speaker !== 'user') i--;
            if (i >= 0) setActive(i);
          }
        }
      },
      { rootMargin: '-72px 0px -60% 0px', threshold: 0 }
    );
    document.querySelectorAll('.turn').forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, [turns]);
  return active;
}

// Export to window
Object.assign(window, {
  ProgressBar, TopBar, Sidebar, Turn, TitleBlock, ReadingWarning, ConversationStart,
  SectionMarker, useActiveTurn, estimateReadingTime, STR, LangContext, useStr
});

<script type="text/babel">
// app.jsx — main app for AI Fluisteraar chat viewer

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "papier",
  "bodySize": 19
}/*EDITMODE-END*/;

// Parse a plain-text chat file format:
//   TITLE: ...
//   DATE: ...
//   MODEL: ...
//   USER: ...
//   AI: ...
//   SYNOPSIS: ...
//   SOURCE: ...
//   BACK: ...
//   ==========
//   [USER LABEL]
//   ...body...
//   [AI LABEL]
//   ...body...
function parseChatText(raw) {
  const sepMatch = raw.match(/^([\s\S]*?)\n=+\s*\n([\s\S]*)$/);
  let headerBlock = '', body = raw;
  if (sepMatch) { headerBlock = sepMatch[1]; body = sepMatch[2]; }

  // Parse header
  const meta = {};
  const keyMap = {
    TITLE: 'title', DATE: 'date', MODEL: 'model',
    USER: 'participantUser', AI: 'participantAI',
    SYNOPSIS: 'synopsis', SOURCE: 'sourceUrl', BACK: 'backUrl',
    WARNING: 'warning', DOCUMENT: 'documentUrl'
  };
  for (const line of headerBlock.split('\n')) {
    const m = line.match(/^([A-Z_]+):\s*(.+)$/);
    if (m && keyMap[m[1]]) meta[keyMap[m[1]]] = m[2].trim();
  }

  // Parse turns
  const userLabel = (meta.participantUser || 'USER').toUpperCase();
  const aiLabel = (meta.participantAI || 'AI').toUpperCase();
  const turns = [];
  const lines = body.split('\n');
  let cur = null;
  for (const line of lines) {
    // Side-track markers: [[ZIJWEG-START]] / [[ZIJWEG-END]]
    const mk = line.match(/^\[\[([A-Z0-9_-]+)\]\]\s*$/);
    if (mk) {
      if (cur) { turns.push(cur); cur = null; }
      turns.push({ kind: 'marker', marker: mk[1].toLowerCase() });
      continue;
    }
    const m = line.match(/^\[([^\]]+)\]\s*$/);
    if (m) {
      if (cur) turns.push(cur);
      const label = m[1].trim().toUpperCase();
      const speaker = (label === userLabel) ? 'user' : 'ai';
      // Display name: capitalize first letter, lower the rest (HAJO→Hajo, GROK→Grok, GEMINI→Gemini)
      const raw = m[1].trim();
      const name = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
      cur = { speaker, name, text: '' };
    } else if (cur) {
      cur.text += (cur.text ? '\n' : '') + line;
    }
  }
  if (cur) turns.push(cur);

  // Trim trailing blank lines from each turn
  turns.forEach(t => { if (t.kind !== 'marker') t.text = t.text.trim(); });
  return { meta, turns: turns.filter(t => t.kind === 'marker' || t.text) };
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Shared language switch — synced with the landing page via localStorage 'aifl-lang'.
  // Auto-EN: an English page can force English by embedding/linking the chat with
  // ?lang=en (or #en); arriving from a referrer under /english is also honoured.
  const [lang, setLangState] = React.useState(() => {
    try {
      const q = (new URLSearchParams(location.search).get('lang')
                 || location.hash.replace(/^#/, '')).toLowerCase();
      if (q === 'en' || q === 'nl') { localStorage.setItem('aifl-lang', q); return q; }
      const ref = (document.referrer || '').toLowerCase();
      if (/\/(english|en)(\/|$|\?|#)/.test(ref)) return 'en';
      return localStorage.getItem('aifl-lang') || 'nl';
    } catch (_) { return 'nl'; }
  });
  const setLang = React.useCallback((l) => {
    try { localStorage.setItem('aifl-lang', l); } catch (_) {}
    setLangState(l);
  }, []);
  React.useEffect(() => { document.documentElement.lang = lang; }, [lang]);
  const S = STR[lang];

  const chatData = React.useMemo(() => {
    const pick = (id) => {
      const el = document.getElementById(id);
      return el && el.textContent.trim() ? el.textContent : null;
    };
    const txt = (lang === 'en' && pick('chat-text-en')) || pick('chat-text');
    if (txt) return parseChatText(txt);
    const jsonEl = document.getElementById('chat-data');
    if (jsonEl && jsonEl.textContent.trim()) {
      try { return JSON.parse(jsonEl.textContent); } catch (_) {}
    }
    return null;
  }, [lang]);

  const turns = (chatData && chatData.turns) || [];
  const meta = (chatData && chatData.meta) || {};

  // Apply theme + size to <html>
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', t.theme);
    document.documentElement.style.setProperty('--body-size', t.bodySize + 'px');
  }, [t.theme, t.bodySize]);

  const readingMinutes = React.useMemo(() => estimateReadingTime(turns), [turns]);
  const turnCount = turns.filter(t => t.kind !== 'marker').length;
  const fullMeta = { ...meta, turnCount };

  // Flag which turns fall inside the f(x) → y side-track, so they can be tinted
  let _inAside = false;
  const asideFlags = turns.map(t => {
    if (t.kind === 'marker') {
      if (t.marker === 'zijweg-start') _inAside = true;
      else if (t.marker === 'zijweg-end') _inAside = false;
      return false;
    }
    return _inAside;
  });

  if (!chatData) {
    return <div style={{padding:'48px', textAlign:'center', color:'var(--ink-muted)', fontFamily:'var(--font-ui)', fontSize:12, letterSpacing:'0.1em', textTransform:'uppercase'}}>{S.loading}</div>;
  }

  return (
    <LangContext.Provider value={lang}>
      <ProgressBar />
      <TopBar backUrl={meta.backUrl} lang={lang} onLang={setLang} />
      <div className="layout">
        <article className="article" spellCheck={false}>
          <TitleBlock meta={fullMeta} readingMinutes={readingMinutes} />
          <ReadingWarning text={meta.warning} />
          <div className="conversation">
            <ConversationStart date={meta.date} />
            {turns.map((turn, idx) => (
              turn.kind === 'marker'
                ? <SectionMarker key={idx} marker={turn.marker} />
                : <Turn
                    key={idx}
                    idx={idx}
                    turn={turn}
                    aside={asideFlags[idx]}
                    participantUser={meta.participantUser || 'Mens'}
                    participantAI={meta.participantAI || 'AI'}
                  />
            ))}
          </div>
          <div className="endcap">
            <span>{S.endcap}</span>
            {meta.sourceUrl && (
              <a href={meta.sourceUrl} target="_blank" rel="noopener">{S.original}</a>
            )}
          </div>
          {meta.documentUrl && (
            <div className="doc-link-wrap">
              <a className="doc-link" href={meta.documentUrl} target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
                <span>{S.docLink}</span>
              </a>
            </div>
          )}
        </article>
      </div>

      <TweaksPanel title={S.tweaksTitle} subtitle={S.tweaksSubtitle}>
        <TweakSection label={S.atmosphere} />
        <TweakRadio
          label={S.theme}
          value={t.theme}
          options={[
            { value: 'wit',    label: S.themeWit },
            { value: 'grijs',  label: S.themeGrijs },
            { value: 'avond',  label: S.themeAvond }
          ]}
          onChange={(v) => setTweak('theme', v)}
        />
        <TweakSection label={S.typography} />
        <TweakSlider
          label={S.textSize}
          value={t.bodySize}
          min={15} max={24} step={1} unit="px"
          onChange={(v) => setTweak('bodySize', v)}
        />
      </TweaksPanel>
    </LangContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
