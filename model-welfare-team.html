<style>
/* --- AI Fluisteraar chat viewer ------------------------------------- */
/* Theme tokens — overridden by [data-theme="..."] on <html> ----------- */
:root {
  /* Wit (default) — clean white, black ink, blue + grey accents */
  --bg:        #ffffff;
  --bg-soft:   #f4f6f9;
  --bg-elev:   #ffffff;
  --ink:       #16181d;
  --ink-muted: #5b6472;
  --ink-faint: #9aa3b2;
  --rule:      #e7e3da;
  --rule-soft: #f0ece3;
  --accent:    #a9762e;
  --intro:     #1583ad;
  --selection: #f0e3cf;
  --aside-tint: #faf8f4;

  --font-body:    "Newsreader", Georgia, "Times New Roman", serif;
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-ui:      "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;

  --body-size:    18px;
  --body-leading: 1.68;
}

:root[data-theme="grijs"] {
  --bg:        #f4f5f7;
  --bg-soft:   #eaecf0;
  --bg-elev:   #fbfbfc;
  --ink:       #1a1c21;
  --ink-muted: #5c6470;
  --ink-faint: #969ca7;
  --rule:      #ddd8cd;
  --rule-soft: #e7e2d8;
  --accent:    #a9762e;
  --intro:     #1583ad;
  --selection: #ecdfca;
  --aside-tint: #f1eee7;
}

:root[data-theme="avond"] {
  --bg:        #14161b;
  --bg-soft:   #1c1f26;
  --bg-elev:   #1a1d23;
  --ink:       #e7eaf0;
  --ink-muted: #99a2b2;
  --ink-faint: #626b7a;
  --rule:      #322d25;
  --rule-soft: #28241d;
  --accent:    #d4a45f;
  --intro:     #4dc4ef;
  --selection: #4a3a22;
  --aside-tint: #1a1812;
}

/* --- Base ------------------------------------------------------------ */
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--body-size);
  line-height: var(--body-leading);
  font-feature-settings: "kern", "liga", "calt";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--selection); }

a {
  color: var(--ink);
  text-decoration-color: var(--rule);
  text-underline-offset: 3px;
}
a:hover { text-decoration-color: var(--accent); color: var(--accent); }

/* --- Reading progress bar ------------------------------------------- */
.progress-bar {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  width: 0%;
  background: var(--accent);
  z-index: 100;
  transition: width 0.08s linear;
}

/* --- Top bar -------------------------------------------------------- */
.topbar {
  position: sticky;
  top: 0;
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule-soft);
  z-index: 50;
}
.topbar-inner {
  max-width: 980px;
  margin: 0 auto;
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.back-link {
  font-family: var(--font-ui);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  white-space: nowrap;
}
.back-link:hover { color: var(--accent); }
.back-link .arrow { transition: transform 0.2s; }
.back-link:hover .arrow { transform: translateX(-3px); }

.topbar-actions {
  display: flex;
  gap: 4px;
  align-items: center;
}
.icon-btn {
  font-family: var(--font-ui);
  font-size: 12px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 7px 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.icon-btn:hover { color: var(--ink); background: var(--bg-soft); }
.icon-btn svg { width: 14px; height: 14px; }

/* Language toggle */
.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-right: 6px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  overflow: hidden;
}
.lang-toggle button {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.08em;
  border: 0;
  background: transparent;
  color: var(--ink-faint);
  padding: 4px 10px;
  cursor: pointer;
  transition: 0.15s;
}
.lang-toggle button:hover { color: var(--ink-muted); }
.lang-toggle button.on { background: var(--accent); color: #fff; }

/* --- Layout grid --------------------------------------------------- */
.layout {
  margin: 0 auto;
  padding: 72px 32px 140px;
  display: flex;
  justify-content: center;
}
@media (max-width: 700px) {
  .layout { padding: 36px 22px 90px; }
}
.gutter-right { display: none; }

/* --- Sidebar ToC --------------------------------------------------- */
.sidebar {
  grid-column: 1;
  position: sticky;
  top: 72px;
  align-self: start;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
  padding-right: 8px;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }

.toc-heading {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 12px;
  padding-left: 12px;
}
.toc-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border-left: 1px solid var(--rule-soft);
}
.toc-item {
  display: block;
  padding: 8px 0 8px 14px;
  font-size: 13px;
  line-height: 1.45;
  color: var(--ink-muted);
  text-decoration: none;
  border-left: 2px solid transparent;
  margin-left: -1px;
  font-family: var(--font-body);
  font-style: italic;
}
.toc-item:hover { color: var(--ink); }
.toc-item.active {
  color: var(--ink);
  border-left-color: var(--accent);
}

/* --- Article ------------------------------------------------------- */
.article {
  width: 100%;
  max-width: 640px;
}

.title-block {
  margin-bottom: 36px;
}
.kicker {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 400;
  color: var(--ink-muted);
  margin: 0 0 26px;
}
.kicker strong { font-weight: 500; }
.kicker .dot {
  display: inline-block;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  margin: 0 10px 2px;
  vertical-align: middle;
}
h1.title {
  font-family: var(--font-display);
  font-size: clamp(38px, 5.2vw, 58px);
  line-height: 1.05;
  font-weight: 500;
  letter-spacing: -0.005em;
  margin: 0 0 16px;
  color: var(--ink);
  text-wrap: balance;
}
.subtitle {
  font-family: var(--font-display);
  font-size: clamp(18px, 2.1vw, 24px);
  line-height: 1.3;
  font-weight: 400;
  color: var(--ink-muted);
  margin: 0 0 28px;
  max-width: none;
  text-wrap: pretty;
}
.meta-row {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
  color: var(--ink-faint);
  margin: 0 0 34px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
}
.meta-row .sep { color: var(--rule); }
.synopsis {
  font-family: var(--font-display);
  font-size: 1.5em;
  line-height: 1.42;
  color: var(--intro);
  margin: 0;
  font-style: italic;
  font-weight: 500;
  text-wrap: pretty;
}
.title-rule {
  width: 64px;
  height: 1px;
  background: var(--ink-muted);
  margin: 32px 0 0;
  opacity: 0.5;
}

/* --- Reading warning (standard format element) -------------------- */
.reading-warning {
  margin: 36px 0 4px;
  padding: 22px 26px;
  background: var(--bg-soft);
  border-radius: 3px;
}
.rw-label {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--accent);
  margin: 0 0 10px;
}
.rw-text {
  font-family: var(--font-body);
  font-style: italic;
  font-size: 1.02em;
  line-height: 1.55;
  color: var(--ink-muted);
  margin: 0;
  text-wrap: pretty;
}

/* --- Reading guide: shared bits & the f(x) side-track jump -------- */
.rw-rule {
  height: 1px;
  background: var(--rule-soft);
  margin: 20px 0;
}
.fx {
  font-family: var(--font-ui);
  font-style: normal;
  font-size: 0.92em;
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.zijweg-link {
  font-family: var(--font-ui);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  background: transparent;
  border: 0;
  padding: 0;
  margin: 16px 0 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.zijweg-link .arr { transition: transform 0.2s; }
.zijweg-link:hover .arr { transform: translateX(4px); }

/* --- Review marker: reconstructed / uncertain passages -------------- */
mark.recon {
  background: rgba(255, 209, 71, 0.40);
  color: inherit;
  border-bottom: 2px dashed rgba(201, 148, 0, 0.95);
  border-radius: 2px;
  padding: 0 2px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
:root[data-theme="avond"] mark.recon { background: rgba(255, 209, 71, 0.20); color: #ffe6a3; border-bottom-color: rgba(255, 209, 71, 0.8); }
@media print { mark.recon { background: #fff0c2; border-bottom: 1px dashed #b08400; } }

/* --- Side-track section markers ----------------------------------- */
.zijweg-start {
  margin: 52px 0;
  padding: 28px 30px;
  background: var(--bg-soft);
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--accent);
  border-radius: 3px;
  scroll-margin-top: 84px;
}
.zw-label {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--accent);
  margin: 0 0 14px;
}
.zw-title {
  font-family: var(--font-display);
  font-size: 1.7em;
  line-height: 1.18;
  font-weight: 500;
  font-style: italic;
  margin: 0 0 12px;
  color: var(--ink);
  text-wrap: balance;
}
.zw-text {
  font-family: var(--font-body);
  font-size: 1em;
  line-height: 1.55;
  color: var(--ink-muted);
  margin: 0;
  text-wrap: pretty;
}
.zijweg-end {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 52px 0;
  scroll-margin-top: 84px;
}
.zijweg-end .zw-rule {
  flex: 1;
  height: 1px;
  background: var(--accent);
  opacity: 0.38;
}
.zw-end-label {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--accent);
  white-space: nowrap;
}

/* Tint the turns that fall inside the side-track so the region is
   recognizable in the background as you scroll/skim. */
.turn-aside {
  background: var(--aside-tint);
  margin-left: -24px;
  margin-right: -24px;
  padding-left: 24px;
  padding-right: 24px;
  box-shadow: inset 2px 0 0 color-mix(in oklab, var(--accent) 32%, transparent);
}
@media (max-width: 700px) {
  .turn-aside {
    margin-left: -16px;
    margin-right: -16px;
    padding-left: 16px;
    padding-right: 16px;
  }
}

/* --- Conversation -------------------------------------------------- */
.conversation {
  display: flex;
  flex-direction: column;
}
.convo-start {
  display: flex;
  align-items: center;
  gap: 18px;
  margin: 28px 0 40px;
}
.convo-start .cs-rule {
  flex: 1;
  height: 1px;
  background: var(--rule);
}
.convo-start .cs-label {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--ink-faint);
  white-space: nowrap;
}
.turn {
  margin: 0;
  padding: 40px 0;
  border-top: 1px solid var(--rule-soft);
}
.turn:first-child { border-top: 0; padding-top: 0; }

.turn-label {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 16px;
  font-weight: 600;
}
.turn-user .turn-label { color: var(--accent); }

.turn-body {
  font-family: var(--font-body);
  font-size: 1em;
  line-height: var(--body-leading);
  color: var(--ink);
  font-variation-settings: "opsz" 16;
}
.turn-body p {
  margin: 0 0 1em;
  text-wrap: pretty;
  hyphens: auto;
}
.turn-body p:last-child { margin-bottom: 0; }
.turn-body ul {
  margin: 0 0 1em;
  padding-left: 1.3em;
  list-style: none;
}
.turn-body ul li {
  position: relative;
  margin-bottom: 0.4em;
}
.turn-body ul li::before {
  content: "·";
  position: absolute;
  left: -0.9em;
  color: var(--ink-muted);
  font-weight: bold;
}
.turn-body ol {
  margin: 0 0 1em;
  padding-left: 1.5em;
}
.turn-body ol li { margin-bottom: 0.4em; }
.turn-body h3 {
  font-family: var(--font-body);
  font-size: 1.08em;
  font-weight: 600;
  letter-spacing: -0.005em;
  margin: 1.5em 0 0.5em;
  color: var(--ink);
}
.turn-body h3.num-head {
  font-weight: 600;
  font-size: 1.08em;
  font-variant-numeric: oldstyle-nums;
}
.turn-body h3.num-head .num {
  font-family: var(--font-ui);
  font-weight: 500;
  font-size: 0.82em;
  color: var(--accent);
  font-variant-numeric: lining-nums;
  margin-right: 0.5em;
}
.turn-body em { font-style: italic; }
.turn-body strong { font-weight: 600; }
.turn-body a { color: var(--accent); text-decoration-color: color-mix(in oklab, var(--accent) 45%, transparent); text-underline-offset: 3px; overflow-wrap: anywhere; }
.turn-body a:hover { color: var(--accent); text-decoration-color: var(--accent); }
.turn-body blockquote {
  margin: 0 0 1em;
  padding-left: 1em;
  border-left: 2px solid var(--rule);
  color: var(--ink-muted);
  font-style: italic;
}

/* User turn: subtle inset, no color; AI turn: full width */
.turn-user {
  padding-left: 0;
}
.turn-user .turn-body {
  padding-left: 28px;
  border-left: 1px solid var(--rule);
}
@media (max-width: 600px) {
  .turn-user .turn-body { padding-left: 16px; }
}

/* --- Image figure (shared in-conversation) ------------------------- */
.turn-figure {
  margin: 0 0 1.1em;
}
.turn-figure img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 5px;
  border: 1px solid var(--rule);
  box-shadow: 0 18px 40px -28px rgba(20, 16, 8, 0.55);
}
:root[data-theme="avond"] .turn-figure img { border-color: var(--rule); box-shadow: 0 18px 44px -26px rgba(0,0,0,0.7); }
.turn-figure figcaption {
  font-family: var(--font-ui);
  font-size: 11.5px;
  letter-spacing: 0.03em;
  color: var(--ink-faint);
  margin-top: 9px;
  line-height: 1.4;
}

/* --- Reasoning ("interne gedachtengang") --------------------------- */
/* Claude's raw scratchpad, shown collapsed by default — the gap between
   the unedited thought-stream and the polished reply is the point of this
   particular conversation. */
.reasoning {
  margin: 4px 0 30px;
  background: var(--aside-tint);
  border: 1px solid var(--rule-soft);
  border-left: 2px solid var(--ink-faint);
  border-radius: 4px;
  overflow: hidden;
}
.reasoning-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  cursor: pointer;
  padding: 15px 18px;
  font-family: inherit;
  color: var(--ink-muted);
}
.reasoning-head:hover { background: color-mix(in oklab, var(--ink) 4%, transparent); }
.reasoning-chev {
  flex: none;
  width: 13px;
  height: 13px;
  margin-top: 3px;
  transition: transform 0.2s ease;
  color: var(--ink-faint);
}
.reasoning.open .reasoning-chev { transform: rotate(90deg); }
.reasoning-headtext { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.reasoning-kicker {
  font-family: var(--font-ui);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  margin-bottom: 0;
}
.reasoning-kicker .rk-time {
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
.reasoning-summary {
  display: block;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 1.12em;
  line-height: 1.3;
  color: var(--ink);
  text-wrap: pretty;
}
.reasoning-body {
  padding: 2px 18px 20px 43px;
}
.reasoning-body p {
  font-family: var(--font-ui);
  font-weight: 300;
  font-size: 0.86em;
  line-height: 1.62;
  color: var(--ink-muted);
  margin: 0 0 0.9em;
  text-wrap: pretty;
}
.reasoning-body p:last-child { margin-bottom: 0; }
.reasoning-body em { font-style: italic; }
.reasoning-body strong { font-weight: 500; color: var(--ink); }
.reasoning-note {
  margin-top: 14px;
  font-family: var(--font-ui);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--ink-faint);
  font-style: normal;
}
@media (max-width: 600px) {
  .reasoning-body { padding-left: 18px; }
}
@media print {
  .reasoning { break-inside: avoid; page-break-inside: avoid; background: #faf8f4; }
  .reasoning-chev { display: none; }
  .reasoning-body { display: block !important; }
}

/* --- Version switch (abridged / full) ----------------------------- */
.version-switch {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin: 0 0 34px;
}
.vs-label {
  font-family: var(--font-ui); font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-faint);
}
.vs-seg {
  display: inline-flex; border: 1px solid var(--rule); border-radius: 999px;
  overflow: hidden; background: var(--bg-elev);
}
.vs-opt {
  font-family: var(--font-ui); font-size: 12.5px; letter-spacing: 0.02em;
  color: var(--ink-muted); text-decoration: none;
  padding: 7px 17px; transition: 0.15s; white-space: nowrap;
}
.vs-opt + .vs-opt { border-left: 1px solid var(--rule); }
a.vs-opt:hover { color: var(--ink); background: var(--bg-soft); }
.vs-opt.on { background: var(--accent); color: #fff; cursor: default; }

/* --- End cap ------------------------------------------------------- */
.endcap {
  margin-top: 64px;
  padding-top: 32px;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--font-ui);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
.endcap a { color: var(--ink-faint); }
.endcap a:hover { color: var(--accent); }

/* --- Link to the original document --------------------------------- */
.doc-link-wrap {
  display: flex;
  justify-content: center;
  margin-top: 30px;
}
.doc-link {
  font-family: var(--font-ui);
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--accent);

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

// Estimate reading time at ~200 words/min
function estimateReadingTime(turns) {
  const words = turns.reduce((a, t) => a + (t.text ? t.text.split(/\s+/).length : 0), 0);
  return Math.max(1, Math.round(words / 200));
}

// Smooth-scroll to an anchored element, accounting for the sticky topbar
function jumpToAnchor(id) {
  const el = document.getElementById(id);
  if (el) {
    const y = el.getBoundingClientRect().top + window.scrollY - 72;
    window.scrollTo({ top: y, behavior: 'smooth' });
  }
}

// Short label for ToC item — first ~7 words of the user prompt
function tocSnippet(text) {
  const cleaned = text.replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
  const words = cleaned.split(' ');
  const snippet = words.slice(0, 9).join(' ');
  return snippet + (words.length > 9 ? '…' : '');
}

// Convert turn raw text → structured blocks
// Recognizes paragraphs, bullets (•), numbered lists (1.), small headers (lines with emoji + bold-looking title)
function parseBlocks(raw) {
  const lines = raw.split('\n').map(l => l.trimEnd());
  const blocks = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.trim() === '') { i++; continue; }

    // Explicit sub-heading: "### Title"
    if (/^###\s+/.test(l)) {
      blocks.push({ type: 'h3', text: l.replace(/^###\s+/, '') });
      i++;
      continue;
    }

    // Image figure: ![caption](src)
    const imgM = l.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/);
    if (imgM) {
      blocks.push({ type: 'img', alt: imgM[1], src: imgM[2] });
      i++;
      continue;
    }

    // Header pattern: starts with emoji + short title-like line
    if (/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}✅❗📌📎🎯]/u.test(l) && l.length < 90 && !/^[•·]/.test(l)) {
      // Try to detect if this is a "heading" — usually one line, often followed by bullets
      const next = lines[i + 1] || '';
      if (l.length < 90) {
        blocks.push({ type: 'h3', text: l.replace(/^([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}✅❗📌📎🎯])\s*/u, '$1  ') });
        i++;
        continue;
      }
    }

    // Bullet list
    if (/^[•·]\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^[•·]\s/.test(lines[i])) {
        items.push(lines[i].replace(/^[•·]\s+/, ''));
        i++;
      }
      blocks.push({ type: 'ul', items });
      continue;
    }

    // Numbered list
    if (/^\d+\.\s/.test(l)) {
      const items = [];
      const numbers = [];
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) {
        const m = lines[i].match(/^(\d+)\.\s+(.*)$/);
        numbers.push(parseInt(m[1]));
        items.push(m[2]);
        i++;
      }
      // If only a single item, it's likely a numbered header (e.g. "1. Cognitieve intelligentie (IQ)")
      // followed by bullets — render as a paragraph with the number preserved.
      if (items.length === 1) {
        blocks.push({ type: 'numHead', num: numbers[0], text: items[0] });
      } else {
        blocks.push({ type: 'ol', items, start: numbers[0] });
      }
      continue;
    }

    // Paragraph (single line in our reflowed text)
    blocks.push({ type: 'p', text: l });
    i++;
  }
  return blocks;
}

// Render inline formatting: _italic_, ==review-mark== (reconstructed/uncertain), and auto-linked URLs
function linkifyText(str, keyBase) {
  const re = /(https?:\/\/[^\s]+)/g;
  const out = [];
  let last = 0, m, n = 0;
  while ((m = re.exec(str)) !== null) {
    if (m.index > last) out.push(str.slice(last, m.index));
    let url = m[1];
    let trail = '';
    const mt = url.match(/[).,;:!?]+$/);
    if (mt) { trail = mt[0]; url = url.slice(0, url.length - trail.length); }
    out.push(<a key={keyBase + '-u' + (n++)} href={url} target="_blank" rel="noopener noreferrer">{url}</a>);
    if (trail) out.push(trail);
    last = re.lastIndex;
  }
  if (last < str.length) out.push(str.slice(last));
  return out.length ? out : str;
}
function renderInline(text) {
  // Split on **bold** and ==highlight== first, then _italic_ within plain segments
  const parts = text.split(/(\*\*[^*\n]+\*\*|==[^=\n]+==)/g);
  return parts.map((p, idx) => {
    if (/^==[^=]+==$/.test(p)) {
      return <mark key={idx} className="recon" title={(typeof document !== 'undefined' && document.documentElement.lang === 'en') ? STR.en.reconTitle : STR.nl.reconTitle}>{p.slice(2, -2)}</mark>;
    }
    if (/^\*\*[^*]+\*\*$/.test(p)) {
      return <strong key={idx}>{p.slice(2, -2)}</strong>;
    }
    const sub = p.split(/(_[^_\n]+_)/g);
    return sub.map((q, j) => /^_[^_]+_$/.test(q) ? <em key={idx + '-' + j}>{q.slice(1, -1)}</em> : linkifyText(q, idx + '-' + j));
  });
}

// --- ProgressBar ----------------------------------------------------
function ProgressBar() {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setPct(max > 0 ? Math.min(100, (h.scrollTop / max) * 100) : 0);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
    };
  }, []);
  return <div className="progress-bar" style={{ width: pct + '%' }} />;
}

// --- Turn ----------------------------------------------------------
function Turn({ turn, idx, participantUser, participantAI, aside }) {
  const blocks = useMemo(() => parseBlocks(turn.text), [turn.text]);
  const label = turn.speaker === 'user'
    ? (turn.name || participantUser)
    : (turn.name || participantAI);
  return (
    <section
      id={`turn-${idx}`}
      className={'turn ' + (turn.speaker === 'user' ? 'turn-user' : 'turn-ai') + (aside ? ' turn-aside' : '')}
    >
      <p className="turn-label">
        <span>{label}</span>
      </p>
      <div className="turn-body">
        {blocks.map((b, i) => {
          if (b.type === 'p') return <p key={i}>{renderInline(b.text)}</p>;
          if (b.type === 'img') return (
            <figure key={i} className="turn-figure">
              <img src={b.src} alt={b.alt} loading="lazy" />
              {b.alt ? <figcaption>{b.alt}</figcaption> : null}
            </figure>
          );
          if (b.type === 'h3') return <h3 key={i}>{renderInline(b.text)}</h3>;
          if (b.type === 'numHead') return (
            <h3 key={i} className="num-head"><span className="num">{b.num}.</span> {renderInline(b.text)}</h3>
          );
          if (b.type === 'ul') return (
            <ul key={i}>{b.items.map((it, j) => <li key={j}>{renderInline(it)}</li>)}</ul>
          );
          if (b.type === 'ol') return (
            <ol key={i} start={b.start}>{b.items.map((it, j) => <li key={j}>{renderInline(it)}</li>)}</ol>
          );
          return null;
        })}
      </div>
    </section>
  );
}

// --- Reasoning ("interne gedachtengang") --------------------------
function Reasoning({ turn }) {
  const S = useStr();
  const [open, setOpen] = useState(false);
  const { time, summary, body } = useMemo(() => {
    const lines = turn.text.split('\n');
    let idx = 0;
    while (idx < lines.length && lines[idx].trim() === '') idx++;
    const head = (lines[idx] || '').trim();
    const m = head.match(/^(\d{1,2}:\d{2})\s*[—·\-]\s*(.*)$/);
    const time = m ? m[1] : null;
    const summary = m ? m[2] : head;
    const body = lines.slice(idx + 1).join('\n').trim();
    return { time, summary, body };
  }, [turn.text]);
  const paras = body.split(/\n+/).filter(Boolean);
  return (
    <section className={'reasoning' + (open ? ' open' : '')}>
      <button type="button" className="reasoning-head" aria-expanded={open} onClick={() => setOpen(o => !o)}>
        <svg className="reasoning-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        <span className="reasoning-headtext">
          <span className="reasoning-kicker">
            <span>{S.reasoningLabel}</span>
            {time && <span className="rk-time">{time}</span>}
          </span>
          <span className="reasoning-summary">{summary}</span>
        </span>
      </button>
      {open && (
        <div className="reasoning-body">
          {paras.map((p, i) => <p key={i}>{renderInline(p)}</p>)}
          <p className="reasoning-note">{S.reasoningNote}</p>
        </div>
      )}
    </section>
  );
}

function VersionSwitch({ meta, lang }) {

}

// --- Active turn observer -----------------------------------------
function useActiveTurn(turns) {
  const [active, setActive] = useState(null);
  useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        const visible = entries
          .filter(e => e.isIntersecting)
          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (visible.length) {
          const idStr = visible[0].target.id;
          const m = idStr.match(/^turn-(\d+)$/);
          if (m) {
            // Find nearest preceding user turn
            let i = parseInt(m[1]);
            while (i >= 0 && turns[i].speaker !== 'user') i--;
            if (i >= 0) setActive(i);
          }
        }
      },
      { rootMargin: '-72px 0px -60% 0px', threshold: 0 }
    );
    document.querySelectorAll('.turn').forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, [turns]);
  return active;
}

// Export to window
Object.assign(window, {
  ProgressBar, TopBar, Sidebar, Turn, Reasoning, VersionSwitch, TitleBlock, ReadingWarning, ConversationStart,
  SectionMarker, useActiveTurn, estimateReadingTime, STR, LangContext, useStr
});

</script>
<script type="text/babel">
// app.jsx — main app for AI Fluisteraar chat viewer

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "wit",
  "bodySize": 18
}/*EDITMODE-END*/;

// Parse a plain-text chat file format:
//   TITLE: ...
//   DATE: ...
//   MODEL: ...
//   USER: ...
//   AI: ...
//   SYNOPSIS: ...
//   SOURCE: ...
//   BACK: ...
//   ==========
//   [USER LABEL]
//   ...body...
//   [AI LABEL]
//   ...body...
function parseChatText(raw) {
  const sepMatch = raw.match(/^([\s\S]*?)\n=+\s*\n([\s\S]*)$/);
  let headerBlock = '', body = raw;
  if (sepMatch) { headerBlock = sepMatch[1]; body = sepMatch[2]; }

  // Parse header
  const meta = {};
  const keyMap = {
    TITLE: 'title', DATE: 'date', MODEL: 'model',
    USER: 'participantUser', AI: 'participantAI',
    SYNOPSIS: 'synopsis', SOURCE: 'sourceUrl', BACK: 'backUrl',
    WARNING: 'warning', DOCUMENT: 'documentUrl', SUBTITLE: 'subtitle',
    VERSION: 'versionThis', SHORT: 'versionShortUrl', FULL: 'versionFullUrl'
  };
  for (const line of headerBlock.split('\n')) {
    const m = line.match(/^([A-Z_]+):\s*(.+)$/);
    if (m && keyMap[m[1]]) meta[keyMap[m[1]]] = m[2].trim();
  }

  // Parse turns
  const userLabel = (meta.participantUser || 'USER').toUpperCase();
  const aiLabel = (meta.participantAI || 'AI').toUpperCase();
  const turns = [];
  const lines = body.split('\n');
  let cur = null;
  for (const line of lines) {
    // Side-track markers: [[ZIJWEG-START]] / [[ZIJWEG-END]]
    const mk = line.match(/^\[\[([A-Z0-9_-]+)\]\]\s*$/);
    if (mk) {
      if (cur) { turns.push(cur); cur = null; }
      turns.push({ kind: 'marker', marker: mk[1].toLowerCase() });
      continue;
    }
    const m = line.match(/^\[([^\]]+)\]\s*$/);
    if (m) {
      if (cur) turns.push(cur);
      const label = m[1].trim().toUpperCase();
      if (label === 'REASONING' || label === 'GEDACHTENGANG') {
        cur = { kind: 'reasoning', text: '' };
      } else {
        const speaker = (label === userLabel) ? 'user' : 'ai';
        // Display name: preserve as written in the body (so "ChatGPT", "Hajo" keep their casing)
        const name = m[1].trim();
        cur = { speaker, name, text: '' };
      }
    } else if (cur) {
      cur.text += (cur.text ? '\n' : '') + line;
    }
  }
  if (cur) turns.push(cur);

  // Trim trailing blank lines from each turn
  turns.forEach(t => { if (t.kind !== 'marker') t.text = t.text.trim(); });
  return { meta, turns: turns.filter(t => t.kind === 'marker' || t.text) };
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Shared language switch — synced with the landing page via localStorage 'aifl-lang'.
  // Auto-EN: an English page can force English by embedding/linking the chat with
  // ?lang=en (or #en); arriving from a referrer under /english is also honoured.
  const [lang, setLangState] = React.useState(() => {
    try {
      const q = (new URLSearchParams(location.search).get('lang')
                 || location.hash.replace(/^#/, '')).toLowerCase();
      if (q === 'en' || q === 'nl') { localStorage.setItem('aifl-lang', q); return q; }
      const ref = (document.referrer || '').toLowerCase();
      if (/\/(english|en)(\/|$|\?|#)/.test(ref)) return 'en';
      return localStorage.getItem('aifl-lang') || 'nl';
    } catch (_) { return 'nl'; }
  });
  const setLang = React.useCallback((l) => {
    try { localStorage.setItem('aifl-lang', l); } catch (_) {}
    setLangState(l);
  }, []);
  React.useEffect(() => { document.documentElement.lang = lang; }, [lang]);
  const S = STR[lang];

  // Read chat data: inline EN block when in English, else the NL block.
  const chatData = React.useMemo(() => {
    const pick = (id) => {
      const el = document.getElementById(id);
      return el && el.textContent.trim() ? el.textContent : null;
    };
    const txt = (lang === 'en' && pick('chat-text-en')) || pick('chat-text');
    if (txt) return parseChatText(txt);
    const jsonEl = document.getElementById('chat-data');
    if (jsonEl && jsonEl.textContent.trim()) {
      try { return JSON.parse(jsonEl.textContent); } catch (_) {}
    }
    return null;
  }, [lang]);

  const turns = (chatData && chatData.turns) || [];
  const meta = (chatData && chatData.meta) || {};

  // Apply theme + size to <html>
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', t.theme);
    document.documentElement.style.setProperty('--body-size', t.bodySize + 'px');
  }, [t.theme, t.bodySize]);

  const readingMinutes = React.useMemo(() => estimateReadingTime(turns), [turns]);
  const turnCount = turns.filter(t => t.kind !== 'marker' && t.kind !== 'reasoning').length;
  const fullMeta = { ...meta, turnCount };

  // Flag which turns fall inside the f(x) → y side-track, so they can be tinted
  let _inAside = false;
  const asideFlags = turns.map(t => {
    if (t.kind === 'marker') {
      if (t.marker === 'zijweg-start') _inAside = true;
      else if (t.marker === 'zijweg-end') _inAside = false;
      return false;
    }
    return _inAside;
  });

  if (!chatData) {
    return <div style={{padding:'48px', textAlign:'center', color:'var(--ink-muted)', fontFamily:'var(--font-ui)', fontSize:12, letterSpacing:'0.1em', textTransform:'uppercase'}}>{S.loading}</div>;
  }

  return (
    <LangContext.Provider value={lang}>
      <ProgressBar />
      <TopBar backUrl={meta.backUrl} lang={lang} onLang={setLang} />
      <div className="layout">
        <article className="article" spellCheck={false}>
          <TitleBlock meta={fullMeta} readingMinutes={readingMinutes} />
          <VersionSwitch meta={fullMeta} lang={lang} />
          <ReadingWarning text={meta.warning} />
          <div className="conversation">
            <ConversationStart date={meta.date} />
            {turns.map((turn, idx) => (
              turn.kind === 'marker'
                ? <SectionMarker key={idx} marker={turn.marker} />
                : turn.kind === 'reasoning'
                ? <Reasoning key={idx} turn={turn} />
                : <Turn
                    key={idx}
                    idx={idx}
                    turn={turn}
                    aside={asideFlags[idx]}
                    participantUser={meta.participantUser || 'Mens'}
                    participantAI={meta.participantAI || 'AI'}
                  />
            ))}
          </div>
          <div className="endcap">
            <span>{S.endcap}</span>
            {meta.sourceUrl && (
              <a href={meta.sourceUrl} target="_blank" rel="noopener">{S.original}</a>
            )}
          </div>
          {meta.documentUrl && (
            <div className="doc-link-wrap">
              <a className="doc-link" href={meta.documentUrl} target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
                <span>{S.docLink}</span>
              </a>
            </div>
          )}
        </article>
      </div>

      <TweaksPanel title={S.tweaksTitle} subtitle={S.tweaksSubtitle}>
        <TweakSection label={S.atmosphere} />
        <TweakRadio
          label={S.theme}
          value={t.theme}
          options={[
            { value: 'wit',    label: S.themeWit },
            { value: 'grijs',  label: S.themeGrijs },
            { value: 'avond',  label: S.themeAvond }
          ]}
          onChange={(v) => setTweak('theme', v)}
        />
        <TweakSection label={S.typography} />
        <TweakSlider
          label={S.textSize}
          value={t.bodySize}
          min={15} max={24} step={1} unit="px"
          onChange={(v) => setTweak('bodySize', v)}
        />
      </TweaksPanel>
    </LangContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
